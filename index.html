<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="MasterCards — Flashcards Offline-First estilo Anki." />
  <title>MasterCards</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./assets/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ===== Cabecera (dashboard y estudio) ===== -->
  <header id="app-header" class="app-header hidden" hidden>
    <button id="btn-back" class="icon-btn" aria-label="Volver" hidden>
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1 id="header-title">MasterCards</h1>
    <div class="header-actions">
      <span id="sync-indicator" class="sync-indicator" title="Estado de sincronización">
        <i class="fa-solid fa-cloud"></i>
      </span>
      <button id="btn-settings" class="icon-btn" aria-label="Ajustes">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <main id="app-main">

    <!-- ===== LOGIN ===== -->
    <section class="screen" data-screen="login">
      <div class="login-wrap">
        <div class="logo">MC</div>
        <h2>MasterCards</h2>
        <p class="muted">Tus flashcards, siempre contigo.<br />Inicia sesión con Google para sincronizar.</p>
        <div id="g_id_onload" data-auto_select="false"></div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black"
             data-text="continue_with" data-size="large" data-width="260"></div>
        <p id="login-error" class="error hidden"></p>
      </div>
    </section>

    <!-- ===== DASHBOARD ===== -->
    <section class="screen" data-screen="dashboard">
      <div class="toolbar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="search-input" type="search" placeholder="Buscar mazos…" autocomplete="off" />
        </div>
        <div class="filters" id="filters">
          <button class="chip" data-filter="vencidas">Vencidas</button>
          <button class="chip" data-filter="nuevas">Nuevas</button>
          <button class="chip" data-filter="favoritas">Favoritas</button>
        </div>
        <div class="dash-actions">
          <button id="btn-study-today" class="btn primary">
            <i class="fa-solid fa-graduation-cap"></i> Estudiar Hoy
          </button>
          <button id="btn-sort-toggle" class="btn ghost" title="Cambiar orden">
            <i class="fa-solid fa-arrow-down-a-z"></i> Alfabético
          </button>
        </div>
      </div>

      <div id="deck-list" class="deck-list"></div>
      <div id="dashboard-empty" class="empty hidden">
        <i class="fa-solid fa-layer-group"></i>
        <p>No hay mazos todavía.</p>
        <p class="muted">Toca <i class="fa-solid fa-plus"></i> para crear el primero.</p>
      </div>

      <button id="fab" class="fab" aria-label="Crear mazo">
        <i class="fa-solid fa-plus"></i>
      </button>
    </section>

    <!-- ===== CREAR MAZO (bottom sheet) ===== -->
    <section class="screen sheet" data-screen="crearMazo" hidden>
      <div class="sheet-header">
        <h2>Crear mazo</h2>
        <button class="icon-btn" data-close-sheet aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <label class="field-label">Nombre del mazo</label>
      <input id="deck-name" class="input" type="text" maxlength="60" placeholder="Ej: Inglés Básico" />

      <label class="field-label">Ícono</label>
      <div id="deck-icon-picker" class="icon-picker"></div>

      <label class="field-label">Color de acento</label>
      <div id="deck-color-picker" class="color-picker"></div>

      <div class="tabs">
        <button id="tab-json" class="tab active">Pegar JSON</button>
        <button id="tab-single" class="tab">Tarjeta individual</button>
      </div>

      <!-- Modo JSON -->
      <div id="panel-json">
        <label class="field-label">JSON de la IA <span class="muted">[{"q":"...","a":"...","e":"opcional"}]</span></label>
        <textarea id="json-input" class="input textarea" rows="8"
          placeholder='[{"q":"¿Qué significa PWA?","a":"Progressive Web App","e":"PWA = aplicación web instalable"},{"q":"2+2","a":"4"}]'></textarea>
        <p id="json-feedback" class="muted small"></p>
      </div>

      <!-- Modo individual -->
      <div id="panel-single" hidden>
        <label class="field-label">Pregunta</label>
        <textarea id="single-q" class="input textarea" rows="2"></textarea>
        <label class="field-label">Respuesta</label>
        <textarea id="single-a" class="input textarea" rows="2"></textarea>
        <label class="field-label">Explicación (¿por qué?) <span class="muted">opcional</span></label>
        <textarea id="single-e" class="input textarea" rows="2"></textarea>
      </div>

      <button id="btn-create-deck" class="btn primary block">
        <i class="fa-solid fa-plus"></i> Crear mazo
      </button>
    </section>

    <!-- ===== ESTUDIO ===== -->
    <section class="screen" data-screen="estudio" hidden>
      <div class="study-top">
        <p id="study-info" class="muted small"></p>
        <div class="progress"><div id="study-progress" class="progress-fill"></div></div>
      </div>

      <div id="study-empty" class="empty hidden">
        <i class="fa-solid fa-calendar-check"></i>
        <p id="study-empty-text">¡Nada pendiente por hoy!</p>
      </div>

      <div id="study-area" hidden>
        <div id="flashcard" class="flashcard" role="button" tabindex="0" aria-label="Dar la vuelta a la tarjeta">
          <div class="card-inner">
            <div class="card-face card-front">
              <i id="card-icon" class="fa-solid fa-bolt card-deco"></i>
              <div id="card-q" class="card-content markdown"></div>
            </div>
            <div class="card-face card-back">
              <div id="card-a" class="card-content markdown"></div>
              <div id="card-e" class="card-why" hidden>
                <div class="why-title"><i class="fa-solid fa-circle-question"></i> ¿Por qué?</div>
                <div id="card-e-text" class="markdown"></div>
              </div>
            </div>
          </div>
          <div class="card-tools">
            <button id="btn-fav-card" class="tool-btn" aria-label="Marcar como favorita"><i class="fa-regular fa-star"></i></button>
            <button id="btn-edit-card" class="tool-btn" aria-label="Editar tarjeta"><i class="fa-solid fa-pen"></i></button>
            <button id="btn-del-card" class="tool-btn danger" aria-label="Borrar tarjeta"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>

        <div id="edit-panel" class="edit-panel" hidden>
          <label class="field-label">Pregunta</label>
          <textarea id="edit-q" class="input textarea" rows="3"></textarea>
          <label class="field-label">Respuesta</label>
          <textarea id="edit-a" class="input textarea" rows="3"></textarea>
          <label class="field-label">Explicación <span class="muted">opcional</span></label>
          <textarea id="edit-e" class="input textarea" rows="2"></textarea>
          <div class="row-gap">
            <button id="btn-save-edit" class="btn primary"><i class="fa-solid fa-check"></i> Guardar</button>
            <button id="btn-cancel-edit" class="btn ghost">Cancelar</button>
          </div>
        </div>

        <div id="srs-buttons" class="srs-row">
          <button class="srs srs-again" data-q="1"><i class="fa-solid fa-rotate-left"></i><span>Otra vez</span></button>
          <button class="srs srs-hard"  data-q="3"><i class="fa-solid fa-angles-down"></i><span>Difícil</span></button>
          <button class="srs srs-good"  data-q="4"><i class="fa-solid fa-circle-check"></i><span>Bien</span></button>
          <button class="srs srs-easy"  data-q="5"><i class="fa-solid fa-bolt"></i><span>Fácil</span></button>
        </div>
      </div>
    </section>

    <!-- ===== RESUMEN ===== -->
    <section class="screen" data-screen="resumen" hidden>
      <div class="summary-stats">
        <div class="stat"><span id="sum-vistas">0</span><label>Vistas</label></div>
        <div class="stat"><span id="sum-aciertos">0</span><label>Aciertos</label></div>
        <div class="stat"><span id="sum-pct">0%</span><label>Correcto</label></div>
        <div class="stat"><span id="sum-tiempo">0s</span><label>Tiempo</label></div>
      </div>

      <div class="filters">
        <button class="chip active" data-summary-filter="falladas">Falladas</button>
        <button class="chip" data-summary-filter="correctas">Correctas</button>
        <button class="chip" data-summary-filter="todas">Todas</button>
      </div>
      <div id="summary-list" class="summary-list"></div>

      <div class="row-gap">
        <button id="btn-again-failed" class="btn primary"><i class="fa-solid fa-rotate-left"></i> Repasar falladas</button>
        <button id="btn-summary-close" class="btn ghost">Volver al inicio</button>
      </div>
    </section>

    <!-- ===== AJUSTES ===== -->
    <section class="screen" data-screen="ajustes" hidden>
      <h2>Ajustes</h2>

      <label class="field-label">Tema</label>
      <div class="segmented" id="seg-tema">
        <button data-value="auto">Auto</button>
        <button data-value="claro">Claro</button>
        <button data-value="oscuro">Oscuro</button>
      </div>

      <label class="field-label">Animaciones</label>
      <div class="segmented" id="seg-anim">
        <button data-value="sutil">Sutil</button>
        <button data-value="hibrido">Híbrido</button>
        <button data-value="vistoso">Vistoso</button>
      </div>

      <label class="field-label">Revelar solución</label>
      <div class="segmented" id="seg-revelar">
        <button data-value="fallar">Al fallar</button>
        <button data-value="final">Al final</button>
      </div>

      <label class="field-label">
        Límite diario de nuevas: <span id="limite-val">20</span>
      </label>
      <input id="limite-slider" type="range" min="5" max="100" step="5" value="20" />

      <div class="row-gap">
        <button id="btn-export" class="btn ghost"><i class="fa-solid fa-file-export"></i> Exportar datos</button>
        <button id="btn-wipe" class="btn danger-ghost"><i class="fa-solid fa-trash"></i> Borrar datos locales</button>
      </div>
      <button id="btn-logout" class="btn danger-ghost block"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <div class="row-gap">
        <button id="modal-cancel" class="btn ghost">Cancelar</button>
        <button id="modal-ok" class="btn primary">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Google Identity Services (GIS) — flujo redirect -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="./app.js"></script>
</body>
</html>
